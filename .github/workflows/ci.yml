name: CI

on:
  push:
    branches: [Bonhomme, main, master, "entropy/**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ClusterFuck
        uses: actions/checkout@v4
      - name: Submission + honesty contracts
        run: |
          python3 scripts/validate-submission.py
          python3 scripts/test_contracts.py

  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout ClusterFuck
        uses: actions/checkout@v4
        with:
          path: ClusterFuck

      # Path dependency ../NATURaL/BonhommeCore requires the sibling repo.
      - name: Checkout NATURaL sibling
        uses: actions/checkout@v4
        with:
          repository: LeBonhommePharma/NATURaL
          path: NATURaL

      - name: Contracts
        working-directory: ClusterFuck
        run: |
          python3 scripts/validate-submission.py
          python3 scripts/test_contracts.py

      - name: Build library
        working-directory: ClusterFuck
        run: swift build

      - name: Run tests
        working-directory: ClusterFuck
        run: swift test
