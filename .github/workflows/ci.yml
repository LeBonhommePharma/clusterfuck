name: CI

on:
  push:
    branches: [Bonhomme, main, master, "entropy/**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ClusterFuck
        uses: actions/checkout@v4
      - name: Submission + honesty contracts
        run: |
          python3 scripts/validate-submission.py
          python3 scripts/test_contracts.py
          python3 scripts/test_icon_palette_guard.py
          python3 scripts/check_icon_palette.py
          python3 scripts/check_source_palette.py
          python3 scripts/check_project_sync.py
          python3 scripts/test_asset_diagnostics.py
          python3 scripts/test_mutation_harness.py
          python3 scripts/mutation_harness.py

  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout ClusterFuck
        uses: actions/checkout@v4
        with:
          path: ClusterFuck

      # Path dependency ../NATURaL/BonhommeCore requires the sibling repo.
      - name: Checkout NATURaL sibling
        uses: actions/checkout@v4
        with:
          repository: LeBonhommePharma/NATURaL
          path: NATURaL

      - name: Contracts
        working-directory: ClusterFuck
        run: |
          python3 scripts/validate-submission.py
          python3 scripts/test_contracts.py
          python3 scripts/test_icon_palette_guard.py
          python3 scripts/check_icon_palette.py
          python3 scripts/check_source_palette.py
          python3 scripts/check_project_sync.py
          python3 scripts/test_asset_diagnostics.py
          python3 scripts/test_mutation_harness.py
          python3 scripts/mutation_harness.py

      - name: Build library
        working-directory: ClusterFuck
        run: swift build

      - name: Run tests
        working-directory: ClusterFuck
        run: swift test

      - name: Standalone Health and HUD contracts
        working-directory: ClusterFuck
        run: |
          swiftc Sources/NaturalRemote/Session/RemoteHUDEvidence.swift scripts/test-hud-evidence.swift -o /tmp/clusterfuck-hud-tests
          /tmp/clusterfuck-hud-tests
          swiftc Sources/NaturalRemote/Session/RemoteHealthObservation.swift scripts/test-health-observation.swift -o /tmp/clusterfuck-health-tests
          /tmp/clusterfuck-health-tests

      - name: Compile iOS and watchOS hosts
        working-directory: ClusterFuck
        run: |
          set -o pipefail
          xcodebuild -jobs 2 -resultBundlePath /tmp/clusterfuck-ios.xcresult -project ClusterFuck.xcodeproj -scheme ClusterFuck -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/clusterfuck-ios CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/clusterfuck-ios-build.log

      - name: Compile native Mac host
        working-directory: ClusterFuck
        run: |
          set -o pipefail
          xcodebuild -jobs 2 -resultBundlePath /tmp/clusterfuck-mac.xcresult -project ClusterFuck.xcodeproj -scheme ClusterFuckMac -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath /tmp/clusterfuck-mac CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/clusterfuck-mac-build.log

      # Runs on success too. The bar for the icon set is zero actool errors,
      # warnings AND notices; while this ran only `if: failure()` and read only
      # errorSummaries, that bar could not be measured on a green build.
      # Reporting only — no ceiling is enforced here yet, on purpose.
      - name: Report asset catalog diagnostics
        if: always()
        working-directory: ClusterFuck
        run: |
          python3 scripts/report_asset_diagnostics.py /tmp/clusterfuck-ios-build.log /tmp/clusterfuck-mac-build.log

      - name: Report Xcode issue summaries
        if: always()
        working-directory: ClusterFuck
        run: |
          python3 scripts/report_xcresult_issues.py /tmp/clusterfuck-ios.xcresult /tmp/clusterfuck-mac.xcresult

      - name: Preserve app build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clusterfuck-app-build-results
          path: |
            /tmp/clusterfuck-ios.xcresult
            /tmp/clusterfuck-mac.xcresult
          if-no-files-found: ignore
          retention-days: 7
